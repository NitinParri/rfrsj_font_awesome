<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta content="width=device-width, initial-scale=1" name="viewport" />
        <title>Font Awesome icons for CKEditor</title>
        <link href="./bootstrap.css" media="all" rel="stylesheet" />
        <link href="./modal.css" media="all" rel="stylesheet" />
    </head>
    <body>
        <div class="p-4">
            <div class="row g-2 mb-1">
                <div class="col-12">
                    <div class="d-flex flex-wrap gap-1 justify-content-center w-100" id="faCatGrp">
                        <button class="btn btn-sm btn-dark p-2 px-3 g-2 m-1 fw-bold" data-cat="brands" aria-pressed="false">Brands</button>
                        <button class="btn btn-sm btn-dark p-2 px-3 g-2 m-1 fw-bold" data-cat="classic" aria-pressed="false">Classic</button>
                        <button class="btn btn-sm btn-dark p-2 px-3 g-2 m-1 fw-bold" data-cat="sharp" aria-pressed="false">Sharp</button>
                        <button class="btn btn-sm btn-dark p-2 px-3 g-2 m-1 fw-bold" data-cat="duotone" aria-pressed="false">Duotone</button>
                        <button class="btn btn-sm btn-dark p-2 px-3 g-2 m-1 fw-bold" data-cat="sharpduotone" aria-pressed="false">Sharp Duotone</button>
                    </div>
                </div>
            </div>
            <div class="row g-2 mb-2">
                <div class="col-12">
                    <div class="d-flex flex-wrap gap-1 justify-content-center w-100" id="faWtGrp">
                        <button class="btn btn-sm btn-outline-secondary p-1 px-3 g-2 m-1" data-wt="fa-thin" aria-pressed="false">Thin</button>
                        <button class="btn btn-sm btn-outline-secondary p-1 px-3 g-2 m-1" data-wt="fa-light" aria-pressed="false">Light</button>
                        <button class="btn btn-sm btn-outline-secondary p-1 px-3 g-2 m-1" data-wt="fa-regular" aria-pressed="false">Regular</button>
                        <button class="btn btn-sm btn-outline-secondary p-1 px-3 g-2 m-1" data-wt="fa-solid" aria-pressed="false">Solid</button>
                    </div>
                </div>
            </div>
            <div class="row g-2 mb-3 mt-3">
                <div class="input-group m-0 col-12 col-md d-flex">
                    <label class="input-group-text small" for="faSearch" data-label="search.label">Search:</label>
                    <input class="form-control" type="search" id="faSearch" name="search" />
                </div>
            </div>
            <div class="row mt-1 g-2">
                <div class="col-12 d-flex flex-wrap gap-3 align-items-center justify-content-center w-100">
                    <div class="form-group">
                        <span class="small">
                            <span data-label="options.label">Set options:</span>
                            <br />
                            <sup data-label="options.hint">(before selecting icon)</sup>
                        </span>
                    </div>
                    <div class="form-group m-1">
                        <select class="form-select form-select-sm" id="faSize" name="faSize">
                            <option value="" data-label="option.size">Size...</option>
                            <option value="fa-2xs">2xs</option>
                            <option value="fa-xs">xs</option>
                            <option value="fa-sm">sm</option>
                            <option value="fa-lg">lg</option>
                            <option value="fa-xl">xl</option>
                            <option value="fa-2x">2x (2em)</option>
                            <option value="fa-3x">3x (3em)</option>
                            <option value="fa-4x">4x (4em)</option>
                            <option value="fa-5x">5x (5em)</option>
                            <option value="fa-6x">6x (6em)</option>
                            <option value="fa-7x">7x (7em)</option>
                            <option value="fa-8x">8x (8em)</option>
                            <option value="fa-9x">9x (9em)</option>
                            <option value="fa-10x">10x (10em)</option>
                        </select>
                    </div>
                    <div class="form-group m-0">
                        <select class="form-select form-select-sm" id="faAnimate" name="faAnimate">
                            <option value="" data-label="option.animate">Animate...</option>
                            <option value="fa-beat">Beat</option>
                            <option value="fa-fade">Fade</option>
                            <option value="fa-beat-fade">Beat Fade</option>
                            <option value="fa-bounce">Bounce</option>
                            <option value="fa-flip">Flip</option>
                            <option value="fa-shake">Shake</option>
                            <option value="fa-spin">Spin</option>
                        </select>
                    </div>
                    <div class="form-group m-0">
                        <select class="form-select form-select-sm" id="faRotate" name="faRotate">
                            <option value="" data-label="option.rotate">Rotate...</option>
                            <option value="fa-rotate-90">90°</option>
                            <option value="fa-rotate-180">180°</option>
                            <option value="fa-rotate-270">270°</option>
                            <option value="fa-flip-horizontal" data-label="rotate.flipHorizontal">Flip horizontal</option>
                            <option value="fa-flip-vertical" data-label="rotate.flipVertical">Flip vertical</option>
                            <option value="fa-flip-both" data-label="rotate.flipBoth">Flip both</option>
                        </select>
                    </div>
                    <div class="form-group m-0">
                        <select class="form-select form-select-sm" id="faPull" name="faPull">
                            <option value="" data-label="option.pull">Pull...</option>
                            <option value="fa-pull-start" data-label="pull.start">Start</option>
                            <option value="fa-pull-end" data-label="pull.end">End</option>
                        </select>
                    </div>
                    <div class="form-group m-0 d-flex align-items-center">
                        <div class="form-check form-switch m-0">
                            <input class="form-check-input" type="checkbox" id="faWidthAuto" name="faWidthAuto" />
                            <label class="form-check-label small" for="faWidthAuto" data-label="option.widthAuto">Auto width</label>
                        </div>
                    </div>
                    <div class="form-group m-0 d-flex align-items-center">
                        <div class="form-check form-switch m-0">
                            <input class="form-check-input" type="checkbox" id="faList" name="faList" />
                            <label class="form-check-label small" for="faList" data-label="option.list">List item</label>
                        </div>
                    </div>
                </div>
            </div>
            <div class="pt-4">
                <div class="row g-4 row-cols-4 row-cols-sm-8" id="faIcons"></div>
            </div>
        </div>

        <script src="./modal.js"></script>
    </body>
</html>
