        default: ["/fileadmin/FontAwesome/css/fontawesome.min.css", "/fileadmin/FontAwesome/css/brands.min.css", "/fileadmin/FontAwesome/css/thin.min.css", "/fileadmin/FontAwesome/css/light.min.css", "/fileadmin/FontAwesome/css/regular.min.css", "/fileadmin/FontAwesome/css/solid.min.css", "/fileadmin/FontAwesome/css/sharp-thin.min.css", "/fileadmin/FontAwesome/css/sharp-light.min.css", "/fileadmin/FontAwesome/css/sharp-regular.min.css", "/fileadmin/FontAwesome/css/sharp-solid.min.css", "/fileadmin/FontAwesome/css/duotone-thin.min.css", "/fileadmin/FontAwesome/css/duotone-light.min.css", "/fileadmin/FontAwesome/css/duotone-regular.min.css", "/fileadmin/FontAwesome/css/duotone.min.css", "/fileadmin/FontAwesome/css/sharp-duotone-thin.min.css", "/fileadmin/FontAwesome/css/sharp-duotone-light.min.css", "/fileadmin/FontAwesome/css/sharp-duotone-regular.min.css", "/fileadmin/FontAwesome/css/sharp-duotone-solid.min.css"]
