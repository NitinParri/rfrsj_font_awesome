categories:
    FontAwesome:
        label: "Refresj Font Awesome"
    FontAwesome.css:
        label: "CSS"
        parent: FontAwesome

settings:
    plugin.tx_rfrsjfontawesome.settings.loadCSS:
        label: "Load CSS in frontend"
        description: "Include all CSS files below in frontend. Note: the icons in CKEditor are based on Font Awesome 7.2.0 Pro Plus."
        category: FontAwesome.css
        type: bool
        default: "1"
